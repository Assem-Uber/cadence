# Test-only workflow measuring Docker build time per variant. Never pushes to Docker Hub.
name: QEMU impact test

on:
  push:
    branches:
      - qemu-impact-test

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/assem-uber/cadence-qemu-test

jobs:
  # 0. current setup: Go compiled under QEMU for arm64
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.baseline
          platforms: linux/amd64, linux/arm64
          build-args: TARGET=server
          push: false

  # 1. cross-compile Go on build platform; QEMU only for runtime-stage RUNs
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: TARGET=server
          push: false

  # 2. cross + GHA layer cache (go mod download, apk, alpine stages)
  cross-gha-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64, linux/arm64
          build-args: TARGET=server
          push: false
          cache-from: type=gha,scope=cross-gha-cache
          cache-to: type=gha,mode=max,scope=cross-gha-cache

  # 3. cross + GHA layer cache + persisted Go module/build cache mounts
  cross-gocache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/cache@v4
        with:
          path: |
            go-mod
            go-build
          key: gocache-${{ github.run_id }}
          restore-keys: gocache-
      - uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "go-mod": "/go/pkg/mod",
              "go-build": "/root/.cache/go-build"
            }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.gocache
          platforms: linux/amd64, linux/arm64
          build-args: TARGET=server
          push: false
          cache-from: type=gha,scope=cross-gocache
          cache-to: type=gha,mode=max,scope=cross-gocache

  # 4. cross, all 5 images in one job (builder stage shared) vs 5 separate jobs today
  cross-all-targets-one-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: server
        uses: docker/build-push-action@v6
        with: { context: ., platforms: "linux/amd64, linux/arm64", build-args: TARGET=server, push: false }
      - name: auto-setup
        uses: docker/build-push-action@v6
        with: { context: ., platforms: "linux/amd64, linux/arm64", build-args: TARGET=auto-setup, push: false }
      - name: cli
        uses: docker/build-push-action@v6
        with: { context: ., platforms: "linux/amd64, linux/arm64", build-args: TARGET=cli, push: false }
      - name: bench
        uses: docker/build-push-action@v6
        with: { context: ., platforms: "linux/amd64, linux/arm64", build-args: TARGET=bench, push: false }
      - name: canary
        uses: docker/build-push-action@v6
        with: { context: ., platforms: "linux/amd64, linux/arm64", build-args: TARGET=canary, push: false }

  # 5. no QEMU at all: native runner per arch, push by digest to GHCR, merge
  native:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: TARGET=server
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  native-merge:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t "$GHCR_IMAGE:server-${{ github.run_number }}" \
            $(printf "$GHCR_IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$GHCR_IMAGE:server-${{ github.run_number }}"
